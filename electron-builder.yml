appId: com.claude-code-desktop.app
productName: Claude Code Desktop
files:
  - dist/**/*
  - dist-electron/**/*
directories:
  output: release
# Prefer npmmirror when GitHub is unreachable (CN / flaky networks)
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# Local releases are unsigned; no electron-updater publish pipeline
forceCodeSigning: false
publish: null
mac:
  # DMG only — mac zip always builds a .blockmap (hashes ~100MB+) and looks "stuck"
  target:
    - dmg
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  # Skip differential-update blockmap after DMG (not needed without auto-update)
  writeUpdateInfo: false
win:
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - AppImage
  category: Development
